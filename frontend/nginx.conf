server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    client_max_body_size 64k;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: https:; media-src 'self' https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https: http:;" always;

    # Temporary download files can take a while to stream. Bodies are tiny JSON.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Fingerprinted Astro assets can be cached aggressively.
    location /_astro/ {
        expires 1y;
        try_files $uri =404;
    }

    location /og/ {
        expires 7d;
        try_files $uri =404;
    }

    # HTML should always be revalidated so deploys are picked up immediately.
    # `expires -1` emits Cache-Control: no-cache without replacing add_header
    # security headers inherited from the server block.
    location / {
        expires -1;
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
